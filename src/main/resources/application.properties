spring.application.name=checkinn
server.port = 8080
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE_PROJECT}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
security.jwt.secret=${JWT_SECRET_PROJECT}
security.jwt.secret.issuer=checkinn
security.jwt.secret.access-token-minutes=60
security.jwt.secret.refresh-token-days=7
app.currency.base=ILS

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/
app.base-url=https://yourdomain.com

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always